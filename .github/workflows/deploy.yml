name: Flutter Web - Build, Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build web for repository subpath
        run: flutter build web --release --base-href "/Microproyecto.-Mariana-y-Alexander/"

      - name: Generate offline PWA assets
        run: python3 tool/build_pwa.py build/web

      - name: Check compiled website
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/manifest.json
          test -s build/web/puzzle-sw.js
          grep -Fq 'canvasKitBaseUrl' build/web/flutter_bootstrap.js
          grep -Fq '<base href="/Microproyecto.-Mariana-y-Alexander/">' build/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
