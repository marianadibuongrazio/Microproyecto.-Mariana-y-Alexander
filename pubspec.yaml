name: puzzle_deslizante
description: "Rompecabezas deslizante de Mariana y Alexander."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/game_logo.svg

  fonts:
    - family: CalSans
      fonts:
        - asset: assets/fonts/CalSans-Regular.ttf
          weight: 400
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
