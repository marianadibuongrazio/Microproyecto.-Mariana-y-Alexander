<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rompecabezas deslizante: resuelve los tableros de 8, 15 y 24 piezas.">
  <meta name="theme-color" content="#091F6A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="manifest" href="manifest.json">
  <title>15-Puzzle · Mariana y Alexander</title>
</head>
<body>
  <script>
    // Offline funciona en la compilacion release y despues de la primera carga online.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('puzzle-sw.js', {
          scope: './',
          updateViaCache: 'none',
        }).then(registration => registration.update())
          .catch(error => console.warn('PWA offline no disponible:', error));
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
